<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MadAsMaths Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--base:#e9eefc;--o1:#8ab4ff;--o2:#d0b3ff;--o3:#8fe6d6;--tx:#101a33;--mu:#4a5676;--gl:rgba(255,255,255,.5);--gl2:rgba(255,255,255,.72);--gb:rgba(255,255,255,.8);--sh:0 8px 32px rgba(40,60,120,.16);--ac:#3b5bdb;--in:rgba(255,255,255,.6);--ok:#0b8a5c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--base:#0a0f1f;--o1:#3b5bdb;--o2:#7048e8;--o3:#0c9c98;--tx:#eaf0ff;--mu:#9ba8c8;--gl:rgba(255,255,255,.07);--gl2:rgba(255,255,255,.13);--gb:rgba(255,255,255,.16);--sh:0 10px 40px rgba(0,0,0,.35);--ac:#8ab4ff;--in:rgba(255,255,255,.08);--ok:#5ee0b0;color-scheme:dark}}
:root[data-theme="dark"]{--base:#0a0f1f;--o1:#3b5bdb;--o2:#7048e8;--o3:#0c9c98;--tx:#eaf0ff;--mu:#9ba8c8;--gl:rgba(255,255,255,.07);--gl2:rgba(255,255,255,.13);--gb:rgba(255,255,255,.16);--sh:0 10px 40px rgba(0,0,0,.35);--ac:#8ab4ff;--in:rgba(255,255,255,.08);--ok:#5ee0b0;color-scheme:dark}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--base);overflow:hidden;-webkit-tap-highlight-color:transparent}

@keyframes drift{to{transform:scale(1.15) translate(2%,3%)}}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.995)}}
@keyframes sp{to{transform:rotate(1turn)}}
.glass{position:relative;overflow:hidden;background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:18px}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 60%)}
.glass:hover::after{opacity:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;height:100%;height:100dvh;padding-top:max(8px,env(safe-area-inset-top));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom));padding-left:max(8px,env(safe-area-inset-left))}
.side{width:236px;display:flex;flex-direction:column;gap:4px;padding:12px;transition:width .25s cubic-bezier(.2,.8,.2,1)}
.col .side{width:64px}.col .lb,.col .rec,.col .kbd{display:none}

.sp{flex:1}
main{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}

#stage{flex:1;position:relative;min-height:0}
.panel{position:absolute;inset:0;display:none;overflow:auto;padding:2px}

.open{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px}
.open:hover{background:var(--gl2)}.t{flex:1;min-width:0}.t em{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.tag,.rf{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--in);color:var(--mu);white-space:nowrap}.rf{color:var(--ac);font-weight:600}
.ic{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:none;color:var(--mu);transition:transform .15s,background .15s}

.pane{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.pdfbar,.nbbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;flex:none}.pn{width:78px;text-align:center}
.nbp{padding:8px}.nbbar select{flex:1}
.pv{flex:1;min-height:140px;isolation:isolate;background:var(--base);backdrop-filter:none;-webkit-backdrop-filter:none}.m-note .pv{min-height:0}
.pdf-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.pdf-scroll.annotate{touch-action:none;user-select:none;-webkit-user-select:none}
.pdf-pages{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px;min-width:100%;width:max-content}
.pdf-page{position:relative;flex:none;width:var(--pdf-width,1px);background:#fff;box-shadow:0 2px 8px #18203538;contain:paint;overflow:hidden}
.pdf-paper,.pdf-ink{position:absolute!important;inset:0;width:100%;height:100%;display:block}
.pdf-paper,.pdf-ink{pointer-events:none}.annotate .pdf-ink.ready .c1{pointer-events:auto}
.pdf-ink :is(.tb,.ins,.pop,.sug,.selm){display:none!important}
.pdf-page-status{position:absolute;inset:0;display:grid;place-content:center;color:#283350;text-align:center;pointer-events:none}
.pdf-page-status button{pointer-events:auto}

.pdf-inkbar .btn,.pdfbar .btn,.pdfbar .seg button{min-height:44px;justify-content:center}
.pdf-inkbar .on{background:#3b5bdb;color:white}.pdf-inkbar label{display:inline-flex;align-items:center;gap:5px;min-height:44px;font-size:13px}
.pdf-inkbar input[type=color]{width:40px;height:38px;padding:3px}.pdf-inkbar select{min-height:40px}
.pdf-reminder,.pdf-save{font-size:12px}.pdf-save{min-width:56px}.pdf-save:empty{display:none}
.pdfbar .pn{width:66px}.pdfbar button:disabled,.pdf-inkbar button:disabled{opacity:.45;cursor:default}
.ld,.er{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:20px;pointer-events:none}.er{pointer-events:auto}
.spin{width:30px;height:30px;border:3px solid var(--gb);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
[hidden]{display:none!important}
.ttl{flex:1;min-width:160px;font:600 18px Fraunces,Georgia,serif}.sv{font-size:12px;color:var(--ok);min-width:70px}
.nbh{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--gb);background:var(--gl)}
.ink{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ink canvas,.ink .ins{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.ink .c1{cursor:crosshair}
.ins{pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.28))}.ins [data-h]{pointer-events:all;touch-action:none;cursor:grab}
.ins .bd{fill:var(--gl2);stroke:var(--gb);stroke-width:1.5}.ins .tk{stroke:var(--tx);opacity:.8;fill:none}.ins text{fill:var(--tx);font:11px Inter,sans-serif}
.ins .hd{fill:var(--gl2);stroke:var(--ac);stroke-width:2}.ins .hx{fill:var(--tx);font:700 16px Inter,sans-serif;text-anchor:middle;pointer-events:none}
.ink .tb{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;padding:5px;max-width:calc(100% - 16px);z-index:5;border-radius:20px}
.tbb{min-width:44px;height:44px;border:0;border-radius:13px;background:none;font-size:18px;display:grid;place-items:center;transition:background .15s,transform .1s}.tbb:active{transform:scale(.92)}.tbb.on{background:linear-gradient(135deg,#3b5bdb,#7048e8);color:#fff}
.sp2{width:1px;height:26px;background:var(--gb);margin:0 4px}.pgn{font-size:13px;padding:0 4px;color:var(--mu)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--gb);display:block}
.ink .pop{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px;z-index:6;max-width:calc(100% - 16px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border-radius:18px}
.pop label{display:flex;align-items:center;gap:8px;width:100%;min-height:36px}.pop input[type=range]{flex:1;min-width:160px}.pop input[type=checkbox]{width:22px;height:22px}
.sws{display:flex;gap:8px;width:100%;justify-content:center}.swt{width:40px;height:40px;border-radius:50%;border:2px solid var(--gb)}.swt.on{outline:3px solid var(--ac);outline-offset:2px}
.sym{width:44px;height:44px;border-radius:11px;border:1px solid var(--gb);background:var(--in);font-size:18px}.pop .btn{flex:1 1 140px}
.sug,.selm{position:absolute;z-index:6;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:14px;font-size:13px}.sug button,.selm button{min-height:40px;padding:4px 12px;border-radius:10px;border:1px solid var(--gb);background:var(--in)}.selm{padding:5px}
.txt{position:absolute;z-index:7;min-width:140px;min-height:44px;resize:none;font-family:Inter,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;padding:10px 18px;transition:.25s;pointer-events:none;z-index:99}#toast.show{opacity:1;transform:translate(-50%,0)}
dialog.glass{position:fixed;color:var(--tx);padding:20px;max-width:340px}dialog::backdrop{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog div{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media(max-width:760px){.side{width:60px}.lb,.rec,.sq,.kbd,.tg{display:none}.app{gap:8px;padding:8px}}
@media(prefers-reduced-motion:reduce){*,.bg{animation:none!important;transition:none!important}}
</style>

<body>
<div class="bg"></div>
<div class="app" id="app">
<aside class="side glass">
 <div class="brand"><b>∂</b><span class="lb">MadAsMaths</span></div>
 <div class="sq"><input id="q" class="in" type="search" placeholder="Search…" aria-label="Search topics, booklets and notes"><span class="kbd">⌘K</span></div>
 <nav id="nav"></nav>
 <div class="sp"></div>
 <button class="nv" data-a="theme"><i>◐</i><span class="lb">Theme</span></button>
 <button class="nv tg" data-a="side"><i>⇤</i><span class="lb">Collapse</span></button>
</aside>
<main>
 <div id="tabs" class="glass"></div>
 <div id="stage"><section class="panel on" data-k="home"></section></div>
</main>
</div>
<div id="toast" class="glass" role="status"></div>
<dialog id="dlg" class="glass"><p id="dm"></p><div><button class="btn" data-a="no">Cancel</button><button class="btn pri" data-a="yes">Delete</button></div></dialog>
<script type="module">
const kv=(()=>{
const local = new Promise(resolve => {
  try {
    const request = indexedDB.open('mam', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('k');
    request.onsuccess = () => resolve(request.result);
    request.onerror = request.onblocked = () => resolve(null);
  } catch { resolve(null); }
});

async function lookup(query) {
  const database = await local;
  if (!database) return undefined;
  return new Promise(resolve => {
    try {
      const request = query(database.transaction('k').objectStore('k'));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(undefined);
    } catch { resolve(undefined); }
  });
}

async function update(write) {
  const database = await local;
  if (!database) return false;
  return new Promise(resolve => {
    try {
      const transaction = database.transaction('k', 'readwrite');
      transaction.oncomplete = () => resolve(true);
      transaction.onabort = transaction.onerror = () => resolve(false);
      write(transaction.objectStore('k'));
    } catch { resolve(false); }
  });
}


return {
  async get(key){const v=await lookup(st=>st.get(key));return v===undefined?null:v},
  async set(key,value){const ok=await update(st=>st.put(value,key));return ok?'Saved on this device':'Not saved · storage unavailable'},
  del(key){return this.set(key,null)}
};
})();
const mountBooklet=(()=>{
const assets = new URL('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/');
let library;

function pdfLibrary() {
  return library ||= import(new URL('legacy/build/pdf.min.mjs', assets).href).then(pdf => {
    pdf.GlobalWorkerOptions.workerSrc=new URL('legacy/build/pdf.worker.min.mjs',assets).href;return pdf;
  }).catch(error => { library = null; throw error; });
}

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const minZoom = .45, maxZoom = 3;

function mountBooklet(panel, booklet, { ink, storage }) {
  const find = selector => panel.querySelector(selector);
  const view = find('.pv');
  view.innerHTML = `
    <div class="pdf-scroll" tabindex="0" aria-label="Booklet pages" hidden><div class="pdf-pages"></div></div>
    <div class="ld" role="status"><i class="spin"></i><span>Loading booklet…</span></div>
    <div class="er" hidden><b>Could not load this booklet</b><span class="mu">This page cannot download it directly. Choose the booklet PDF from your device; it is remembered here.</span><button class="btn" type="button">Retry</button><label class="btn pk">Choose PDF from device<input type="file" accept="application/pdf" hidden></label><a class="btn ow" target="_blank" rel="noopener">Open original PDF</a></div>`;
  const scroll = find('.pdf-scroll'), list = find('.pdf-pages'), loading = find('.ld'), error = find('.er');
  error.querySelector('.ow').href = 'https://madasmaths.com/archive/maths_booklets/' + booklet.id + '.pdf';
  error.querySelector('.pk input').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { await storage.set('pdf:' + booklet.id, await f.arrayBuffer()); } catch {} e.target.value = ''; open(); };
  const pageInput = find('.pn'), total = find('.pdf-total'), zoomLabel = find('.pdf-zoom');
  const inkBar = find('.pdf-inkbar'), hint = find('.pdf-reminder'), saved = find('.pdf-save');
  const modes = [...panel.querySelectorAll('[data-a=amode]')];
  const style = { tool: 'pen', color: '#14213d', w: 3.5 };
  const pages = [], touches = new Map();
  let task, documentPdf, rendering, active, historyPage, width = 0, scale = 1, pageNumber = 1;
  let dead = false, visible = true, annotating = false, finger = false, gesture = false;
  let penUp = 0, frame = 0, saveVersion = 0;

  function controls() {
    const count = pages.length, page = historyPage || pages[pageNumber - 1];
    pageInput.disabled = !count || !!active;
    pageInput.max = count || 1;
    if (document.activeElement !== pageInput) pageInput.value = pageNumber;
    total.textContent = count ? `/ ${count}` : '';
    find('[data-a=pgm]').disabled = !count || pageNumber === 1 || !!active;
    find('[data-a=pgp]').disabled = pageNumber >= count || !!active;
    for (const button of modes) button.disabled = !count || !!active;

 $('#tabs').innerHTML=`<button class="tab ${db.act==='home'?'on':''}" data-a="tab" data-i="home"><span>◧ Workspace</span></button>`+db.tabs.map(k=>{const t=k[0]==='b'?BY[k.slice(2)].t:noteOf(k.slice(2)).title;return`<div class="tab ${k===db.act?'on':''}" data-a="tab" data-i="${esc(k)}" role="button" tabindex="0"><span>${k[0]==='b'?'▤':'✎'} ${esc(t||'Untitled')}</span><button class="x" data-a="close" data-i="${esc(k)}" aria-label="Close tab">×</button></div>`}).join('')}
const topicOf=b=>TOPS.find(t=>t.items.includes(b));
function wsNote(b){let id=db.wn[b.id];if(id&&noteOf(id))return id;const t=topicOf(b),n={id:ID(),title:'Notes · '+b.t,topic:t?'T:'+t.id:'',body:'',u:Date.now()};db.notes.push(n);db.wn[b.id]=n.id;save();return n.id}
const noteOpts=sel=>db.notes.map(n=>`<option value="${n.id}" ${n.id===sel?'selected':''}>${esc(n.title||'Untitled')}</option>`).join('');
function wsHTML(b){const g=G[b.g],m=db.wm[b.id]||'pdf';return`<div class="bar2 glass"><div class="crumb">${g.s} › ${g.n}</div><h2>${esc(b.t)}</h2><div class="seg">${[['pdf','PDF'],['split','Split'],['note','Notebook'],['rev','Revision']].map(([k,l])=>`<button class="${m===k?'on':''}" data-a="lay" data-i="${k}">${l}</button>`).join('')}</div><button class="btn sm" data-a="prev" data-i="${esc(b.id)}" title="Previous booklet">‹</button><button class="btn sm" data-a="next" data-i="${esc(b.id)}" title="Next booklet">›</button><button class="ic" data-a="mark" data-i="${esc(b.id)}" title="Bookmark">★</button><button class="ic ok" data-a="done" data-i="${esc(b.id)}" title="Mark as done">✓</button><button class="btn sm" data-a="fs">⛶</button><a class="btn sm" href="${b.u}" target="_blank" rel="noopener">Original ↗</a></div>
 <div class="wk m-${m}"><div class="pane pdfp"><div class="pdfbar glass" role="group" aria-label="Booklet controls"><button class="btn sm" type="button" data-a="pgm" aria-label="Previous PDF page">‹</button><input class="in pn" type="number" inputmode="numeric" min="1" value="1" aria-label="PDF page"><span class="mu pdf-total"></span><button class="btn sm" type="button" data-a="pgp" aria-label="Next PDF page">›</button><div class="seg"><button class="on" type="button" data-a="amode" data-i="0">Read</button><button type="button" data-a="amode" data-i="1">Annotate</button></div><div class="seg" aria-label="Zoom"><button type="button" data-zoom="out" aria-label="Zoom out">−</button><button type="button" data-zoom="fit" aria-label="Fit width"><span class="pdf-zoom">Fit</span></button><button type="button" data-zoom="in" aria-label="Zoom in">＋</button></div></div>
 <div class="pdf-inkbar glass" role="group" aria-label="PDF annotation tools" hidden><button class="btn sm on" type="button" data-pdf-tool="pen" aria-pressed="true">Pen</button><button class="btn sm" type="button" data-pdf-tool="eraser" aria-pressed="false">Eraser</button><label>Colour <input class="in" type="color" value="#14213d" data-pdf-color></label><label>Size <select class="in" data-pdf-width><option value="2">Fine</option><option value="3.5" selected>Medium</option><option value="7">Bold</option><option value="12">Wide</option></select></label><button class="btn sm" type="button" data-pdf-tool="undo" aria-label="Undo annotation">↶</button><button class="btn sm" type="button" data-pdf-tool="redo" aria-label="Redo annotation">↷</button><label><input type="checkbox" data-pdf-finger> Finger draws</label><span class="mu pdf-reminder"></span><span class="mu pdf-save" role="status"></span></div>
 <div class="view glass pv"></div></div>
 <div class="pane nbp glass"><div class="nbbar"><select class="in" data-wn aria-label="Notebook">${noteOpts(wsNote(b))}</select><button class="btn sm" data-a="wnnew">＋ New</button></div><div class="nbh"></div></div></div>`}
function noteHTML(n){return`<div class="bar2 glass"><input class="in ttl" data-f="title" value="${esc(n.title)}" aria-label="Notebook title"><select class="in" data-f="topic" aria-label="Topic">${opts(n.topic)}</select><span class="sv" role="status"></span><button class="btn sm" data-a="delnote" data-i="${n.id}">Delete</button></div><div class="nbh"></div>`}
const opts=sel=>`<option value="">No topic</option>`+SPEC.map((s,i)=>`<option value="S:${s.s}" ${sel==='S:'+s.s?'selected':''}>${s.s} (general)</option>`).join('')+SPEC.map(s=>s.secs.filter((c,i,a)=>a.findIndex(z=>z.k===c.k)===i).map(sc=>`<optgroup label="${s.c} · ${sc.n.replace(/ \(CP\d\)/,'')}">${sc.topics.map(t=>`<option value="T:${t.id}" ${sel==='T:'+t.id?'selected':''}>${sc.ref} ${t.n} · ${esc(t.name)}</option>`).join('')}</optgroup>`).join('')).join('');
function ensure(k){const st=$('#stage');let el=[...st.children].find(e=>e.dataset.k===k);if(!el){el=document.createElement('section');el.className='panel';el.dataset.k=k;st.append(el);
 if(k[0]==='b'){const b=BY[k.slice(2)];el.innerHTML=wsHTML(b);el._ws=mountBooklet(el,b,{ink:mkInk,storage:kv});mountNB(el.querySelector('.nbh'),db.wn[b.id]||wsNote(b));el._kill=()=>{el._ws.destroy();el.querySelector('.nbh')._kill?.()}}
 else{const n=noteOf(k.slice(2));el.innerHTML=noteHTML(n);const nh=el.querySelector('.nbh');mountNB(nh,n.id,t=>{const s=el.querySelector('.sv');if(s)s.textContent=t});el._kill=()=>nh._kill&&nh._kill()}}return el}
function paint(){
 paintSide();paintTabs();const st=$('#stage'),home=st.querySelector('[data-k=home]');
 if(db.act==='home'){const s=home.scrollTop;home.innerHTML=homeHTML();home.scrollTop=s}else ensure(db.act);
 [...st.children].forEach(el=>{const on=el.dataset.k===db.act;if(!on&&el.classList.contains('on'))el.querySelector('.nbh')?._cancel?.();el.classList.toggle('on',on);el._ws?.setVisible(on&&!el.querySelector('.wk').classList.contains('m-note'))});
 if(db.act[0]==='b'){const id=db.act.slice(2),el=ensure(db.act);el.querySelectorAll('[data-a=mark]').forEach(b=>b.classList.toggle('on',db.marks.includes(id)));el.querySelectorAll('[data-a=done]').forEach(b=>b.classList.toggle('on',db.done.includes(id)))}}
function openTab(k){if(!db.tabs.includes(k))db.tabs.push(k);db.act=k;save();paint()}
function openB(id,mode){db.recent=[id,...db.recent.filter(x=>x!==id)].slice(0,12);if(mode)db.wm[id]=mode;openTab('b:'+id);toast('Opened '+BY[id].t)}
function addNote(t){const n={id:ID(),title:'Untitled page',topic:t||'',body:'',u:Date.now()};db.notes.push(n);openTab('n:'+n.id);toast('New notebook created');return n}
function closeTab(k){const i=db.tabs.indexOf(k);db.tabs.splice(i,1);const el=[...$('#stage').children].find(e=>e.dataset.k===k);if(el){el._kill&&el._kill();el.remove()}if(db.act===k)db.act=db.tabs[i-1]||db.tabs[0]||'home';save();paint()}
function go(v,x){H.v=v;if(v==='spec')H.sub=+x;H.q='';$('#q').value='';db.act='home';paint()}
function neighbour(id,d){const g=G[BY[id].g],i=g.items.findIndex(b=>b.id===id)+d;if(g.items[i])openB(g.items[i].id);else toast('No more booklets in this topic')}
function mv(id,d){const i=db.notes.findIndex(n=>n.id===id),j=i+d;if(j<0||j>=db.notes.length)return;[db.notes[i],db.notes[j]]=[db.notes[j],db.notes[i]];save();paint()}
function toggle(arr,id,m){const a=db[arr],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();paint();toast(i<0?m[0]:m[1])}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i,pan=el.closest('[data-k]');
 if(pan?._ws?.busy()&&['lay','prev','next','pgm','pgp','amode','fs'].includes(a))return;
 if(a==='tab'){if(e.target.closest('[data-a=close]'))return;db.act=i;save();paint()}
 else if(a==='close')closeTab(i);
 else if(a==='nav'){const[v,x]=i.split(':');go(v,x)}
 else if(a==='open')openB(i);
 else if(a==='opennote')openTab('n:'+i);
 else if(a==='topic'){H.v='topic';H.g=+i;H.ft='';H.fk='All';H.q='';$('#q').value='';db.act='home';paint()}
 else if(a==='spec')go('spec',i);
 else if(a==='sec'){H.v='sec';H.si=+i;H.q='';$('#q').value='';db.act='home';paint()}
 else if(a==='tp'){H.v='tp';H.tid=i;H.q='';$('#q').value='';db.act='home';paint()}
 else if(a==='chip'){H.fk=i;paint()}
 else if(a==='mark')toggle('marks',i,['Bookmarked','Bookmark removed']);
 else if(a==='done')toggle('done',i,['Marked as done','Marked as not done']);
 else if(a==='tmark')toggle('tm',i,['Topic bookmarked','Bookmark removed']);
 else if(a==='tdone')toggle('td',i,['Topic marked complete','Topic marked not complete']);
 else if(a==='newnote')addNote(i);
 else if(a==='up')mv(i,-1);else if(a==='dn')mv(i,1);
 else if(a==='prev')neighbour(i,-1);else if(a==='next')neighbour(i,1);
 else if(a==='fs')toggleFs(pan.querySelector('.wk'));
 else if(a==='lay'){const id=pan.dataset.k.slice(2);if(i==='rev'){const t=topicOf(BY[id]);if(t){H.v='tp';H.tid=t.id}else{H.v='topic';H.g=BY[id].g;H.ft='';H.fk='All'}H.q='';db.act='home';paint();return}db.wm[id]=i;save();pan.querySelector('.wk').className='wk m-'+i;pan._ws.setVisible(i!=='note');pan.querySelectorAll('.seg [data-a=lay]').forEach(b=>b.classList.toggle('on',b.dataset.i===i))}
 else if(a==='pgm')pan._ws.setN(pan._ws.n-1);else if(a==='pgp')pan._ws.setN(pan._ws.n+1);
 else if(a==='amode')pan._ws.ann(i==='1');
 else if(a==='wnnew'){const id=pan.dataset.k.slice(2),b=BY[id],t=topicOf(b),n={id:ID(),title:'Notes · '+b.t,topic:t?'T:'+t.id:'',body:'',u:Date.now()};db.notes.push(n);db.wn[id]=n.id;save();swapNote(pan,n.id)}
 else if(a==='delnote')ask('Delete this notebook? This can’t be undone.',()=>{const k='n:'+i;if(db.tabs.includes(k))closeTab(k);const D=NBD[i];(D?D.pages.map(p=>p.id):[]).forEach(p=>kv.del('pg:'+p));kv.del('nb:'+i);delete NBD[i];db.notes=db.notes.filter(n=>n.id!==i);for(const b in db.wn)if(db.wn[b]===i)delete db.wn[b];save();paint();toast('Notebook deleted')});
 else if(a==='yes'){const d=$('#dlg');d.close();d.cb?.();d.cb=null}
 else if(a==='no')$('#dlg').close();
 else if(a==='side'){db.col=db.col?0:1;save();paint()}
 else if(a==='theme'){const d=matchMedia('(prefers-color-scheme:dark)').matches,cur=document.documentElement.dataset.theme||(d?'dark':'light');db.th=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=db.th;save();drawAll()}
});
function toggleFs(w){const d=document,cur=d.fullscreenElement||d.webkitFullscreenElement;
 if(w.classList.contains('pfs')){w.classList.remove('pfs');return}
 if(cur){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
 const r=w.requestFullscreen||w.webkitRequestFullscreen;
 if(r){try{const p=r.call(w);if(p&&p.catch)p.catch(()=>w.classList.add('pfs'));return}catch(e){}}
 w.classList.add('pfs')}
addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.wk.pfs').forEach(w=>w.classList.remove('pfs'))});
function swapNote(pan,id){const nh=pan.querySelector('.nbh'),f=nh._kill;f&&f();const n=document.createElement('div');n.className='nbh';nh.replaceWith(n);mountNB(n,id);pan.querySelector('[data-wn]').innerHTML=noteOpts(id);const b=BY[pan.dataset.k.slice(2)];db.wn[b.id]=id;save()}
let st;
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){H.q=t.value;db.act='home';paint();return}
 if(t.dataset.ft!==undefined){H.ft=t.value;$('#list').innerHTML=list(G[H.g]);return}
 const f=t.dataset.f;if(!f)return;const el=t.closest('[data-k]'),n=noteOf(el.dataset.k.slice(2));
 n[f]=t.value;n.u=Date.now();clearTimeout(st);st=setTimeout(save,300);if(f==='title')paintTabs()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.wn!==undefined){swapNote(t.closest('[data-k]'),t.value)}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#q').focus()}else if(e.key==='Escape'&&H.q){H.q='';$('#q').value='';paint()}});
document.addEventListener('pointermove',e=>{const g=e.target.closest?.('.glass');if(g&&e.pointerType==='mouse'){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',drawAll);
if(db.th)document.documentElement.dataset.theme=db.th;
paint();
</script>
</body>
</html>
